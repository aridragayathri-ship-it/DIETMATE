{% extends 'base.html' %}
{% block title %}Change password · DietMate{% endblock %}
{% block content %}<div class="form-page narrow-form"><div class="form-page-heading"><div><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change password</h1><p>Choose a strong password you do not use elsewhere.</p></div></div><form method="post" class="profile-form"><section class="form-section form-stack"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label><div class="form-actions"><button class="primary-button" type="submit">Update password</button><a class="cancel-link" href="{{ url_for('profile.edit_profile') }}">Back to profile</a></div></section></form></div>{% endblock %}
